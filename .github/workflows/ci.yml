name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci -d crm_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_ci:synthetic-ci-only@127.0.0.1:5432/crm_ci
      TEST_DATABASE_URL: postgresql://crm_ci:synthetic-ci-only@127.0.0.1:5432/crm_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Record runtime
        run: |
          node --version
          npm --version
      - name: Install locked workspaces
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build API and full dashboard
        run: npm run build
        env:
          NODE_ENV: production
      - name: Build portfolio demo
        run: npm run build:demo --workspace frontend
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /portfolio/
      - name: Apply versioned migrations
        run: npm run db:migrate --workspace backend
      - name: Database and API integration tests
        run: npm test --workspace backend
      - name: Demo adapter tests
        run: npm test --workspace frontend
      - name: Validate runtime image
        run: docker build --target runtime --tag minimalist-crm:ci .
      - name: Validate migration image
        run: docker build --target migrate --tag minimalist-crm-migrate:ci .

  pages-build:
    name: Build Pages demo
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NODE_ENV: production
      VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
      VITE_FULL_CRM_URL: ${{ vars.FULL_CRM_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspaces
        run: npm ci --include=dev
      - name: Build standalone fictional demo
        run: npm run build:demo --workspace frontend
      - name: Install verification browser
        run: npm exec --workspace frontend -- playwright install --with-deps chromium
      - name: Verify the exact Pages artifact without an API
        run: npm run test:pages --workspace frontend
      - name: Upload only the static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  pages-deploy:
    name: Deploy Pages demo
    needs: pages-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the tested static artifact
        id: deployment
        uses: actions/deploy-pages@v4
