name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: crm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci -d crm_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://crm_ci:synthetic-ci-only@127.0.0.1:5432/crm_ci
      TEST_DATABASE_URL: postgresql://crm_ci:synthetic-ci-only@127.0.0.1:5432/crm_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Record runtime
        run: |
          node --version
          npm --version
      - name: Install locked workspaces
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Build API and full dashboard
        run: npm run build
        env:
          NODE_ENV: production
      - name: Build portfolio demo
        run: npm run build:demo --workspace frontend
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /portfolio/
      - name: Apply versioned migrations
        run: npm run db:migrate --workspace backend
      - name: Database and API integration tests
        run: npm test --workspace backend
      - name: Demo adapter tests
        run: npm test --workspace frontend
      - name: Validate runtime image
        run: docker build --target runtime --build-arg VCS_REF="$GITHUB_SHA" --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --tag "minimalist-crm:sha-$GITHUB_SHA" .
      - name: Validate migration image
        run: docker build --target migrate --build-arg VCS_REF="$GITHUB_SHA" --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --tag "minimalist-crm-migrate:sha-$GITHUB_SHA" .
      - name: Verify deployment validation and schema compatibility rules
        run: python3 -m unittest discover -s deploy -p test_deploy.py -v
      - name: Verify production HTTPS, migrations, restart and rollback
        run: npm run test:production --workspace backend
        env:
          CRM_TEST_IMAGE: minimalist-crm:sha-${{ github.sha }}
          CRM_TEST_MIGRATION_IMAGE: minimalist-crm-migrate:sha-${{ github.sha }}
      - name: Export exactly the tested image pair
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save "minimalist-crm:sha-$GITHUB_SHA" "minimalist-crm-migrate:sha-$GITHUB_SHA" | gzip > "$RUNNER_TEMP/crm-release-images.tar.gz"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          sha = os.environ['GITHUB_SHA']
          def image_id(name):
              return json.loads(subprocess.check_output(['docker', 'image', 'inspect', name]))[0]['Id']
          data = {'revision': sha, 'runtime_id': image_id('minimalist-crm:sha-' + sha), 'migration_id': image_id('minimalist-crm-migrate:sha-' + sha)}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'crm-release-images.json').write_text(json.dumps(data))
          PY
      - name: Upload tested release images for promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: crm-release-images
          path: |
            ${{ runner.temp }}/crm-release-images.tar.gz
            ${{ runner.temp }}/crm-release-images.json
          retention-days: 1
          compression-level: 0

  publish-images:
    name: Publish tested GHCR images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the verified image pair from this run
        uses: actions/download-artifact@v8
        with:
          name: crm-release-images
          path: ${{ runner.temp }}/release
      - name: Load and verify exact image identities
        run: |
          gzip -dc "$RUNNER_TEMP/release/crm-release-images.tar.gz" | docker load
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          sha = os.environ['GITHUB_SHA']
          data = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'release', 'crm-release-images.json').read_text())
          assert data['revision'] == sha
          for name, key in [('minimalist-crm', 'runtime_id'), ('minimalist-crm-migrate', 'migration_id')]:
              image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', name + ':sha-' + sha]))[0]
              assert image['Id'] == data[key]
              assert image['Config']['Labels']['org.opencontainers.image.revision'] == sha
          PY
      - name: Sign in to GHCR with the scoped job token
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit-SHA tags without rebuilding
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          runtime="$repository-app:sha-$GITHUB_SHA"
          migration="$repository-migrate:sha-$GITHUB_SHA"
          docker tag "minimalist-crm:sha-$GITHUB_SHA" "$runtime"
          docker tag "minimalist-crm-migrate:sha-$GITHUB_SHA" "$migration"
          docker push "$migration"
          docker push "$runtime"
          printf 'Published tested runtime: %s\n\nMigration image: %s\n' "$runtime" "$migration" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect --format '{{json .RepoDigests}}' "$runtime" "$migration" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify registry readback matches the tested images
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull "$repository-app:sha-$GITHUB_SHA"
          docker pull "$repository-migrate:sha-$GITHUB_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          repository = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          sha = os.environ['GITHUB_SHA']
          def identity(name):
              return json.loads(subprocess.check_output(['docker', 'image', 'inspect', name]))[0]['Id']
          assert identity(repository + '-app:sha-' + sha) == identity('minimalist-crm:sha-' + sha)
          assert identity(repository + '-migrate:sha-' + sha) == identity('minimalist-crm-migrate:sha-' + sha)
          PY
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io

  pages-build:
    name: Build Pages demo
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NODE_ENV: production
      VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
      VITE_FULL_CRM_URL: ${{ vars.FULL_CRM_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspaces
        run: npm ci --include=dev
      - name: Build standalone fictional demo
        run: npm run build:demo --workspace frontend
      - name: Install verification browser
        run: npm exec --workspace frontend -- playwright install --with-deps chromium
      - name: Verify the exact Pages artifact without an API
        run: npm run test:pages --workspace frontend
      - name: Upload only the static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  pages-deploy:
    name: Deploy Pages demo
    needs: pages-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy the tested static artifact
        id: deployment
        uses: actions/deploy-pages@v4
